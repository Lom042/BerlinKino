<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Cinema Programme</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#121319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kino Berlin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121319;
    --panel:#1B1D26;
    --panel-raised:#22242F;
    --amber:#FFB627;
    --amber-dim:#8a6a1f;
    --teal:#4ECDC4;
    --red:#E4572E;
    --text:#F2F0E9;
    --muted:#8A8D99;
    --hairline:#2C2E3A;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* ---- Header : departure-board header plate ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--hairline);
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .kicker{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .brand h1{
    margin:0;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .status{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    text-align:right;
  }
  .status .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--teal); margin-right:6px;
    box-shadow:0 0 8px var(--teal);
  }

  /* ---- Date picker ---- */
  .dates{
    display:flex; gap:8px; overflow-x:auto;
    margin-bottom:16px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .dates::-webkit-scrollbar{display:none;}
  .date-chip{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:12.5px;
    padding:10px 14px;
    border-radius:9px;
    border:1px solid var(--hairline);
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    text-align:center;
    line-height:1.3;
    user-select:none;
    transition:all .15s ease;
  }
  .date-chip .top{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em;}
  .date-chip .bottom{display:block; font-weight:700; color:var(--text); font-size:13px;}
  .date-chip:hover{border-color:var(--amber-dim);}
  .date-chip.active{background:var(--amber); border-color:var(--amber);}
  .date-chip.active .top, .date-chip.active .bottom{color:#161616;}

  /* ---- Controls ---- */
  .controls{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom:24px;
  }
  .search{
    flex:1 1 220px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:8px;
    padding:11px 14px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    outline:none;
  }
  .search::placeholder{color:var(--muted);}
  .search:focus{border-color:var(--amber-dim);}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:var(--mono);
    font-size:12px;
    padding:9px 13px;
    border-radius:8px;
    border:1px solid var(--hairline);
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
    user-select:none;
  }
  .chip:hover{border-color:var(--amber-dim); color:var(--text);}
  .chip.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#161616;
    font-weight:700;
  }

  /* ---- Film group ---- */
  .film-group{
    margin-bottom:26px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:10px;
    overflow:hidden;
  }
  .film-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:14px 18px;
    background:var(--panel-raised);
    border-bottom:1px solid var(--hairline);
  }
  .film-head h2{
    margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em;
  }
  .film-head .count{
    font-family:var(--mono); font-size:11px; color:var(--muted);
  }

  .cinema-row{
    display:flex; justify-content:space-between; gap:14px;
    padding:13px 18px;
    border-bottom:1px solid var(--hairline);
    flex-wrap:wrap;
    align-items:center;
  }
  .cinema-row:last-child{border-bottom:none;}
  .cinema-info{min-width:180px;}
  .cinema-name{font-size:14px; font-weight:600;}
  .cinema-addr{font-size:11.5px; color:var(--muted); margin-top:1px;}

  .times{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .time-chip{
    font-family:var(--mono);
    font-size:13px;
    padding:6px 10px;
    background:var(--bg);
    border:1px solid var(--hairline);
    border-radius:6px;
    display:flex; align-items:center; gap:7px;
    overflow:hidden;
  }
  .time-chip .digits{
    display:inline-block;
    animation: flip-in .5s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes flip-in{
    0%{ transform: rotateX(90deg); opacity:0; }
    60%{ transform: rotateX(-8deg); opacity:1; }
    100%{ transform: rotateX(0); }
  }
  .lang-tag{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.04em;
    padding:2px 5px;
    border-radius:4px;
    text-transform:uppercase;
    font-weight:700;
  }
  .lang-tag.ov, .lang-tag.omu{ background:rgba(78,205,196,.18); color:var(--teal); }
  .lang-tag.de{ background:rgba(138,141,153,.18); color:var(--muted); }
  .lang-tag.other{ background:rgba(228,87,46,.18); color:var(--red); }

  .empty{
    text-align:center; color:var(--muted); padding:60px 20px;
    font-family:var(--mono); font-size:13px;
  }

  /* ---- Flat 'by time' rows ---- */
  .flat-row{
    display:flex; align-items:center; gap:14px;
    padding:12px 16px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:8px;
    margin-bottom:8px;
  }
  .flat-row .time-chip{ flex:0 0 auto; }
  .flat-row .flat-info{ flex:1 1 auto; min-width:0; }
  .flat-row .flat-film{ font-size:14px; font-weight:600; }
  .flat-row .flat-cinema{ font-size:11.5px; color:var(--muted); margin-top:1px; }

  footer{
    margin-top:40px; padding-top:18px; border-top:1px solid var(--hairline);
    font-size:11.5px; color:var(--muted); font-family:var(--mono);
    line-height:1.6;
  }
  footer a{color:var(--teal); text-decoration:none;}

  @media (max-width:520px){
    .cinema-row{flex-direction:column; align-items:flex-start;}
    .times{justify-content:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="kicker">Cinema Programme · Berlin</span>
      <h1>What's on, where, and in which language</h1>
    </div>
    <div class="status" id="status">
      <span class="dot"></span>Loading…
    </div>
  </header>

  <div class="dates" id="date-chips"></div>

  <div class="controls">
    <input class="search" id="search" type="text" placeholder="Search for a film (e.g. Spider-Man)…">
    <div class="chips" id="lang-chips">
      <div class="chip active" data-lang="all">All</div>
      <div class="chip" data-lang="ov">OV</div>
      <div class="chip" data-lang="omu">OmU</div>
      <div class="chip" data-lang="de">German dub</div>
    </div>
  </div>

  <div class="chips" id="view-chips" style="margin-bottom:20px;">
    <div class="chip active" data-view="film">By film</div>
    <div class="chip" data-view="cinema">By cinema</div>
    <div class="chip" data-view="time">By time</div>
  </div>

  <div id="results"></div>

  <footer>
    Source: automatically compiled from kino.veranstaltungen-in-berlin.de and yorck.de · non-commercial, no ads, no ticket links<br>
    Data last updated: <span id="generated-at">—</span> · <span id="data-source-note"></span>
  </footer>

</div>

<script>
// ---- Real demo data: Spider-Man: Brand New Day, Berlin, Sat 01.08.2026 ----
// (pulled live for this build — see scraper.py for how a full daily feed,
// covering every film, is generated automatically)
const DEMO_DATA = {
  date: "2026-08-01",
  generated_at: "2026-08-01T09:00:00",
  screenings: [
    { cinema: "Zoo Palast", address: "Hardenbergstr. 29a, 10623 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["13:00","14:15","16:45","17:30","20:45"] },
    { cinema: "Zoo Palast", address: "Hardenbergstr. 29a, 10623 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OV"], times: ["16:15"] },
    { cinema: "Kino in der Kulturbrauerei", address: "Schönhauser Allee 36, 10435 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OmU"], times: ["11:30","14:00","16:45","19:30","22:20"] },
    { cinema: "CineStar CUBIX Filmpalast Alexanderplatz", address: "Rathausstr. 1, 10178 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["11:00","13:15","22:45"] },
    { cinema: "CineStar CUBIX Filmpalast Alexanderplatz", address: "Rathausstr. 1, 10178 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OV"], times: ["11:15","13:30","16:50","19:00","22:20"] },
    { cinema: "CineStar CUBIX Filmpalast Alexanderplatz", address: "Rathausstr. 1, 10178 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["3D","OV"], times: ["20:30"] },
    { cinema: "Cineplex Titania Palast", address: "Schloßstr. 5-6, 12163 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["10:00","13:10","14:00","16:30","19:50","23:20"] },
    { cinema: "Cineplex Titania Palast", address: "Schloßstr. 5-6, 12163 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OV"], times: ["16:00","20:15","23:00"] },
    { cinema: "Cineplex Titania Palast", address: "Schloßstr. 5-6, 12163 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["3D"], times: ["10:30","16:10","19:30"] },
    { cinema: "Cineplex Spandau", address: "Havelstr. 20, 13597 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["10:00","11:55","13:05","14:45","16:30","19:50","23:05"] },
    { cinema: "Cineplex Neukölln Arcaden", address: "Karl-Marx-Str. 66, 12043 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["12:15","14:00","16:30","19:50"] },
    { cinema: "Cineplex Neukölln Arcaden", address: "Karl-Marx-Str. 66, 12043 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OV"], times: ["12:00","14:30","17:00","20:15"] },
    { cinema: "Cineplex Alhambra", address: "Seestr. 94, 13353 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OV"], times: ["13:50","17:00","20:15"] },
    { cinema: "UCI East Side Gallery", address: "Mildred-Harnack-Str. 13, 10243 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["14:00","16:30"] },
    { cinema: "UCI East Side Gallery", address: "Mildred-Harnack-Str. 13, 10243 Berlin", film: "Spider-Man: Brand New Day", format_tags: ["OV"], times: ["15:30"] },
    { cinema: "UCI Kinowelt am Eastgate", address: "Märkische Allee 176-178, 12679 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["14:00","20:10"] },
    { cinema: "CineStar Hellersdorf", address: "Stendaler Str. 25, 12627 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["11:05","14:00","16:55","20:00"] },
    { cinema: "CineStar Tegel", address: "Am Borsigturm 2, 13507 Berlin", film: "Spider-Man: Brand New Day", format_tags: [], times: ["11:30","14:00","16:00","19:30","22:30"] },
  ]
};

let DATA = null;
let activeLang = "all";
let activeView = "film";
let activeDate = null; // ISO string, set once index.json (or fallback) is known
let availableDates = [];
const TODAY_ISO = new Date().toISOString().slice(0, 10);
const WEEKDAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function formatDateChip(iso){
  const d = new Date(iso + "T00:00:00");
  const diffDays = Math.round((d - new Date(TODAY_ISO + "T00:00:00")) / 86400000);
  const top = diffDays === 0 ? "Today" : diffDays === 1 ? "Tomorrow" : WEEKDAY_NAMES[d.getDay()];
  const bottom = `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
  return { top, bottom };
}

function renderDateChips(){
  const wrap = document.getElementById('date-chips');
  wrap.innerHTML = "";
  for (const iso of availableDates){
    const { top, bottom } = formatDateChip(iso);
    const chip = document.createElement('div');
    chip.className = 'date-chip' + (iso === activeDate ? ' active' : '');
    chip.innerHTML = `<span class="top">${top}</span><span class="bottom">${bottom}</span>`;
    chip.addEventListener('click', () => {
      if (iso === activeDate) return;
      activeDate = iso;
      renderDateChips();
      loadDateData(iso);
    });
    wrap.appendChild(chip);
  }
}

async function loadDateData(iso){
  const statusEl = document.getElementById('status');
  const noteEl = document.getElementById('data-source-note');
  statusEl.innerHTML = `<span class="dot"></span>Loading…`;
  try{
    const res = await fetch(`data/${iso}.json`, {cache:"no-store"});
    if (!res.ok) throw new Error("no data for this date");
    DATA = await res.json();
    statusEl.innerHTML = `<span class="dot"></span>Live data loaded`;
    noteEl.textContent = `Source: data/${iso}.json (generated by the scraper)`;
  }catch(e){
    if (iso === TODAY_ISO){
      DATA = DEMO_DATA;
      statusEl.innerHTML = `<span class="dot" style="background:var(--amber);box-shadow:0 0 8px var(--amber);"></span>Demo data (no live feed connected yet)`;
      noteEl.textContent = "Demo data for Spider-Man: Brand New Day, 01.08.2026 — run scraper.py to load every film live";
    } else {
      DATA = { date: iso, generated_at: null, screenings: [] };
      statusEl.innerHTML = `<span class="dot" style="background:var(--red);box-shadow:0 0 8px var(--red);"></span>No data yet for this date`;
      noteEl.textContent = "The scraper hasn't produced a file for this date yet";
    }
  }
  document.getElementById('generated-at').textContent = DATA.generated_at || DATA.date || "—";
  render();
}

async function loadData(){
  try{
    const res = await fetch('data/index.json', {cache:"no-store"});
    if (!res.ok) throw new Error("no index");
    const index = await res.json();
    availableDates = index.dates;
  }catch(e){
    // No live index yet — fall back to just today, backed by demo data.
    availableDates = [TODAY_ISO];
  }
  activeDate = availableDates.includes(TODAY_ISO) ? TODAY_ISO : availableDates[0];
  renderDateChips();
  loadDateData(activeDate);
}

function classifyLang(tags){
  const t = tags.map(x => x.toLowerCase());
  if (t.includes("ov")) return "ov";
  if (t.includes("omu")) return "omu";
  if (t.length === 0) return "de";
  return "other"; // UkrF, etc — shown but not filterable into OV/OmU/DE
}

function langLabel(tags){
  if (tags.length === 0) return { cls:"de", text:"DE" };
  const cls = classifyLang(tags);
  return { cls, text: tags.join(" · ") };
}

function normalizeForSearch(s){
  return s.toLowerCase().replace(/[^a-z0-9À-ÿ]/g, "");
}

function getFilteredScreenings(){
  const qRaw = document.getElementById('search').value.trim();
  const q = normalizeForSearch(qRaw);
  const out = [];
  for (const s of DATA.screenings){
    if (q && !normalizeForSearch(s.film).includes(q)) continue;
    const lang = classifyLang(s.format_tags);
    if (activeLang !== "all" && lang !== activeLang) continue;
    out.push(s);
  }
  return out;
}

function renderTimeChips(times, tags){
  const {cls, text} = langLabel(tags);
  return times.map(t =>
    `<span class="time-chip"><span class="digits">${t}</span><span class="lang-tag ${cls}">${text}</span></span>`
  ).join("");
}

function render(){
  const container = document.getElementById('results');
  container.innerHTML = "";
  const filtered = getFilteredScreenings();

  if (filtered.length === 0){
    container.innerHTML = `<div class="empty">No screenings found — try a different film title or language filter.</div>`;
    return;
  }

  if (activeView === "film") renderByFilm(filtered, container);
  else if (activeView === "cinema") renderByCinema(filtered, container);
  else renderByTime(filtered, container);
}

function renderByFilm(filtered, container){
  const byFilm = new Map();
  for (const s of filtered){
    if (!byFilm.has(s.film)) byFilm.set(s.film, []);
    byFilm.get(s.film).push(s);
  }
  for (const [film, rows] of [...byFilm.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){
    const group = document.createElement('div');
    group.className = 'film-group';
    const head = document.createElement('div');
    head.className = 'film-head';
    head.innerHTML = `<h2>${film}</h2><span class="count">${rows.length} cinema${rows.length===1?'':'s'}</span>`;
    group.appendChild(head);
    for (const row of rows.sort((a,b)=>a.cinema.localeCompare(b.cinema))){
      const r = document.createElement('div');
      r.className = 'cinema-row';
      r.innerHTML = `
        <div class="cinema-info">
          <div class="cinema-name">${row.cinema}</div>
          <div class="cinema-addr">${row.address}</div>
        </div>
        <div class="times">${renderTimeChips(row.times, row.format_tags)}</div>
      `;
      group.appendChild(r);
    }
    container.appendChild(group);
  }
}

function renderByCinema(filtered, container){
  const byCinema = new Map();
  for (const s of filtered){
    if (!byCinema.has(s.cinema)) byCinema.set(s.cinema, {address: s.address, rows: []});
    byCinema.get(s.cinema).rows.push(s);
  }
  for (const [cinema, data] of [...byCinema.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){
    const group = document.createElement('div');
    group.className = 'film-group';
    const head = document.createElement('div');
    head.className = 'film-head';
    head.innerHTML = `<h2>${cinema}</h2><span class="count">${data.address}</span>`;
    group.appendChild(head);
    for (const row of data.rows.sort((a,b)=>a.film.localeCompare(b.film))){
      const r = document.createElement('div');
      r.className = 'cinema-row';
      r.innerHTML = `
        <div class="cinema-info">
          <div class="cinema-name">${row.film}</div>
        </div>
        <div class="times">${renderTimeChips(row.times, row.format_tags)}</div>
      `;
      group.appendChild(r);
    }
    container.appendChild(group);
  }
}

function renderByTime(filtered, container){
  const flat = [];
  for (const s of filtered){
    for (const t of s.times){
      flat.push({time: t, film: s.film, cinema: s.cinema, tags: s.format_tags});
    }
  }
  flat.sort((a,b) => a.time.localeCompare(b.time) || a.film.localeCompare(b.film));
  for (const item of flat){
    const {cls, text} = langLabel(item.tags);
    const row = document.createElement('div');
    row.className = 'flat-row';
    row.innerHTML = `
      <span class="time-chip"><span class="digits">${item.time}</span><span class="lang-tag ${cls}">${text}</span></span>
      <div class="flat-info">
        <div class="flat-film">${item.film}</div>
        <div class="flat-cinema">${item.cinema}</div>
      </div>
    `;
    container.appendChild(row);
  }
}

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('#lang-chips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#lang-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeLang = chip.dataset.lang;
    render();
  });
});

document.querySelectorAll('#view-chips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#view-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeView = chip.dataset.view;
    render();
  });
});

loadData();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
