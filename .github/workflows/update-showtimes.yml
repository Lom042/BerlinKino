name: Update Berlin showtimes

on:
  schedule:
    # Runs at 06:00 and 14:00 UTC (08:00 / 16:00 Berlin time) — showtimes
    # for a cinema rarely change more often than that during the day.
    - cron: "0 6,14 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from GitHub's UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # This used to be able to hang forever (well, until GitHub's own 6-hour
    # hard cap) if any one scraper got stuck — e.g. CinemaxX's site loading
    # oddly under Playwright with no timeout of its own. That silently
    # blocked every single run from ever reaching the "commit" step, which
    # is why the site can stop updating for days without any obvious
    # error. 20 minutes is generous for what's normally a ~1-2 minute job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4
      - run: python scraper.py

      - run: pip install playwright
      - run: playwright install --with-deps chromium
      # continue-on-error + its own short timeout: if CinemaxX's site ever
      # hangs or breaks again, this step gives up after 5 minutes instead
      # of stalling the whole run for 6 hours — and, importantly, the
      # workflow still carries on to commit whatever scraper.py (the main
      # data source, covering the vast majority of cinemas) already
      # produced, rather than losing that day's entire update over one
      # secondary scraper misbehaving.
      - name: Run CinemaxX scraper
        timeout-minutes: 5
        continue-on-error: true
        run: python scraper_cinemaxx.py

      # Yorck scraper is temporarily disabled — its title-extraction logic
      # is producing bad data (grabbing promotional text instead of real
      # film titles). Re-enable once fixed and verified; see scraper_yorck.py.
      # - run: python scraper_yorck.py

      # Adds poster + rating info to every screening, via TMDb's free API
      # (see enrich_tmdb.py for details). TMDB_API_KEY must be set as a
      # repo secret (Settings -> Secrets and variables -> Actions) for this
      # to do anything — if it's missing, the script just skips itself
      # quietly and the site works fine without posters/ratings.
      - name: Add posters + ratings (TMDb)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python enrich_tmdb.py

      - name: Commit updated data
        run: |
          git config user.name "showtimes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update showtimes ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
