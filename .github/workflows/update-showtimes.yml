name: Update Berlin showtimes

on:
  schedule:
    # Runs at 06:00 and 14:00 UTC (08:00 / 16:00 Berlin time) — showtimes
    # for a cinema rarely change more often than that during the day.
    - cron: "0 6,14 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from GitHub's UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4
      - run: python scraper.py

      # CinemaxX and Yorck both need a real headless browser (JS-rendered
      # sites) — one shared Playwright install covers both.
      - run: pip install playwright
      - run: playwright install --with-deps chromium

      # Verified against real --debug output (Aug 2026): OmU/DF tagging
      # and title/time extraction both confirmed correct.
      - run: python scraper_cinemaxx.py
      - run: python scraper_yorck.py

      - name: Commit updated data
        run: |
          git config user.name "showtimes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update showtimes ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
